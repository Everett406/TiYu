name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.10.3
  APP_VERSION_TAG: v2.10.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.10.3

            ### 修复 —— 切题库/换题型范围后刷题进度被清零（第三十九轮：用户真机反馈）

            - **症状**：切换题库（有时又没事）后再回来，刷题只能从第 1 题重开，
              「接续上次进度」也没了；但首页的 已刷 N/800、正确率、连击 等数据都还在。
            - **根因**：刷题进度快照在旧版只有两个存储槽（顺序 / 随机各一份）。
              切到别的题库开刷（哪怕一题没答、只进了刷题页）或换了题型范围，
              新快照就会把原题库的进度快照**覆盖销毁**；而作答记录存在数据库里
              不受影响——这就是「进度没了、统计还在」的原因。
              v2.8.8 的修隔离只挡住了「读」（跨库进度不误显），没堵住「写」的覆盖。
            - **修复**：会话快照升级为**多槽存储**（题库 × 模式 × 题型范围各自占槽，
              上限 10 份按最近使用淘汰）：
              - 切题库开刷、换题型范围刷，都不再互相覆盖；切回原题库/原范围，
                进度原样接续（含作答详情与循环补漏状态）；
              - 首页/小组件「继续刷题」接续该题库+模式下最近保存的一份；
              - 旧版本已有的刷题进度**无损迁移**（自动归位到对应槽，无需任何操作）；
              - 「重新开始」只清当前题库+当前范围的这一份；删题库自动清该库会话；
                题库升级/清空数据仍整体作废（旧题 id 已失配，属预期行为）。
            - static_check 新增防回归：多槽 API 必备断言 + 旧单槽写法残留即 FAIL；
              并修正 widget 布局禁令的检查路径（历史版本拼错路径导致该组检查空转）。

            安装：下载下方 TiYu-2.10.3.apk 覆盖安装即可，数据全部保留。