name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.12.1
  APP_VERSION_TAG: v2.12.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.12.1

            ### 新功能 —— 拍照搜题（第四十五轮）

            - 搜索页新增**相机入口**：拍一页纸质题目（或从相册选图），自动识别、
              切题，并在**你自己的题库**里找到原题——含答案与解析，全程离线、不联网。
            - 小猿搜题式**框选交互**：原图上框出每一道识别到的题（带编号角标），
              点框直达下方对应卡片；点卡片反向高亮对应题块。
            - **选项打乱不怕**：匹配靠题干（题干永远不会被打乱）；结果卡片高亮正确
              选项**内容**并提示「认内容不认字母」——纸质卷把 A/B/C/D 换了位置也能对上。
            - 题目顺序乱不怕：每张卡片独立展示、可展开；未识别到题库原题的，显示
              识别原文并可一键转文字搜索。
            - OCR 采用 ML Kit 中文**离线打包版**（模型随 APK）：运行不依赖任何谷歌
              服务，国产手机可用；零新增权限（拍照走系统相机）。代价：APK +20MB 左右。

            ---

            **安装**：下载下方 `TiYu-2.12.0.apk` 安装覆盖即可，数据自动迁移。
