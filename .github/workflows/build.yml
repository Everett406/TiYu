name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  # IS_PREVIEW=true 时走**草稿预览**通道：APK 内部版本号带 -preview 后缀、
  # versionCode 抬高可覆盖安装线上正式版、Release 以 draft 发布（仓库里可见可下载，
  # 但不对外公开）。验证通过后把 IS_PREVIEW 改回 false、版本号去掉后缀即可正式发。
  IS_PREVIEW: 'true'
  APP_VERSION_NAME: 2.19.25-preview
  APP_VERSION_TAG: v2.19.25-preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon ${{ env.IS_PREVIEW == 'true' && '-PtiyuPreview=true' || '' }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          # 预览通道：draft = 仓库内可见可下载，但不会对外公开
          draft: ${{ env.IS_PREVIEW == 'true' }}
          prerelease: ${{ env.IS_PREVIEW == 'true' }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.25-preview（草稿预览版 · 第 2 稿）

            > **这是一个 draft 预览版**：你能看到、能下载，但它**没有公开发布**。
            > 验证没问题后我再走正式发布。

            ### 这稿按你截图提的 5 个问题改了

            **1. 弹窗左右没留白** —— 之前内容直接贴边，「问 AI」三个字顶到圆角上了。
            现在整块内容统一 20dp 留白。

            **2. 思考过程看不见** —— 之前压根没解析思考流，只收了正文。
            现在 `reasoning_content` 单开一条通道：
            · **思考时能直接看到思考正文**（灰色小字，前面一个呼吸点）
            · **思考完折叠成一行「已思考 12 秒」**，点一下展开全文，再点收起
            · 秒数从正文开始输出的那一刻冻结 —— 不把"吐正文"的时间算成思考时间

            ⚠️ **要看到思考，模型得换成会思考的**：设置里把模型名改成
            `deepseek-reasoner`（或 o1 / R1 这类推理模型）。你现在用的
            `deepseek-flash` 是普通模型，不返回思考内容，那就只有正文。

            **3. 吐字不要光标** —— 那个一闪一闪的 `▍` 没了，就是正常一个字一个字往外冒。

            **4. 输入框和发送按钮不齐** —— 按钮 40dp、输入框靠 padding 撑到 46dp，
            按钮肉眼矮一截。现在统一 44dp，同一行居中对齐。

            **5. Markdown 没渲染** —— 这是最要命的，之前 `**C**`、`\(\frac12\)` 全是原样。
            现在自己写了个渲染器，标题 / 有序无序列表 / **粗体** / *斜体* / 删除线 /
            行内代码 / 代码块 / 引用 / 链接都正常。公式不做排版，但会**降级成能读的**：
            `\frac{1}{2}` → `(1)/(2)`，`\rho` → ρ，`x^2` → x²，`\( \)` 的包裹直接去掉，
            至少不会满屏反斜杠。

            ### 吐字和 Markdown 是怎么共存的

            看着像不可能：一边要一个字一个字冒，一边要 Markdown 正确显示。
            做法是**先解析 Markdown，再按"可见字符数"截断**——
            如果直接截 Markdown 源码，屏幕上会出现半屏裸的 `**` 和没闭合的 `|`
            （这个坑 servllama 也踩过）。

            所以吐字计数只算**去掉标记后你真正能看到的字**，
            `**粗体**` 六个字符里只算「粗体」两个 —— 出字才跟视觉一致。

            ### 其它一切照旧

            ### 其余一切照旧

            模考即时判定与锁定、多选漏选/错选标注、底栏模糊、更换壁纸，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.24-preview.apk` **覆盖安装**即可，学习数据自动迁移。
