name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  # IS_PREVIEW=true 时走**草稿预览**通道：APK 内部版本号带 -preview 后缀、
  # versionCode 抬高可覆盖安装线上正式版、Release 以 draft 发布（仓库里可见可下载，
  # 但不对外公开）。验证通过后把 IS_PREVIEW 改回 false、版本号去掉后缀即可正式发。
  IS_PREVIEW: 'false'
  APP_VERSION_NAME: 2.19.24
  APP_VERSION_TAG: v2.19.24

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon ${{ env.IS_PREVIEW == 'true' && '-PtiyuPreview=true' || '' }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          # 预览通道：draft = 仓库内可见可下载，但不会对外公开
          draft: ${{ env.IS_PREVIEW == 'true' }}
          prerelease: ${{ env.IS_PREVIEW == 'true' }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.24

            ### 先说清楚：切题库闪退是我的锅，已修

            你报的崩溃堆栈很明确：

            ```
            java.lang.NullPointerException
              at PracticeScreenKt.MultiSection(PracticeScreen.kt:943)
              ← PagerState.scrollToPage ← PracticeScreen.kt:326
            ```

            **根因**：`MultiSection` 里算多选状态的这一行写了 `ua!!.picked`，
            而它位于**选项渲染循环内** —— 没作答时 `ua` 就是 null，循环照跑，直接 NPE。

            怎么来的：v2.19.23 我把多选改成「正确 / 错选 / 漏选」四态时，
            原本老老实实待在 `else if (!submitted)` 分支里的 `ua!!`，
            被我**提到了循环顶部挪出了保护范围**。典型的重构事故。

            所以触发条件是：**切到一道没答过的多选题就崩**。
            你换题库后 `details` 被清空，滚过去就撞上了——
            难怪"以前的版本没出现过"，那个 `ua!!` 是 v2.19.23 才有的。

            顺带把同类隐患一起清了（行为不变，零风险）：

            · `AnimatedVisibility(visible = submitted)` 的内容在**退出动画期间仍在组合**，
              此时 visible 已经是 false 而 `ua` 可能已为 null —— 所以连"看着在保护里"的
              `ua!!` 也不能用，填空、简答的几处同样换成了安全调用；
            · 全工程已无 `ua!!`，并写进 static_check 逐行扫，出现即 FAIL。

            ### AI 助手：仍在（三轮草稿的成果保留）

            刷题页每题底部「问 AI」→ 多轮对话，当前题自动进上下文，
            流式 + 吐字、思考过程可见并折叠成「已思考 N 秒」、Markdown 正确渲染、
            思考/正文双通道。配置在「设置 → AI 助手」。

            想看思考记得把模型名换成 `deepseek-reasoner`。

            ### 其余一切照旧

            多选漏选/错选标注、模考即时判定与锁定、底栏模糊、更换壁纸，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.24.apk` **覆盖安装**即可，学习数据自动迁移。
