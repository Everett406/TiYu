name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  # IS_PREVIEW=true 时走**草稿预览**通道：APK 内部版本号带 -preview 后缀、
  # versionCode 抬高可覆盖安装线上正式版、Release 以 draft 发布（仓库里可见可下载，
  # 但不对外公开）。验证通过后把 IS_PREVIEW 改回 false、版本号去掉后缀即可正式发。
  IS_PREVIEW: 'true'
  APP_VERSION_NAME: 2.19.24-preview
  APP_VERSION_TAG: v2.19.24-preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon ${{ env.IS_PREVIEW == 'true' && '-PtiyuPreview=true' || '' }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          # 预览通道：draft = 仓库内可见可下载，但不会对外公开
          draft: ${{ env.IS_PREVIEW == 'true' }}
          prerelease: ${{ env.IS_PREVIEW == 'true' }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.24-preview（草稿预览版）

            > **这是一个 draft 预览版**：你能看到、能下载，但它**没有公开发布**。
            > 验证没问题后我再走正式发布。

            ### 这次加了个新东西：刷题页的「问 AI」

            你说想让 AI **淡一点、不是主要内容，只是略微提升体验**——所以它长这样：

            · 入口只在**每张题目卡片的最底部**，一行小字「问 AI · 就这道题深究一下」，
              没有 FAB、没有角标、不抢任何配色，答完题想深究再点；
            · 点开是底部弹窗，多轮对话；**当前这道题自动进上下文**——
              题干、选项、正确答案、你的作答、题库自带解析全都带上了，你不用贴任何东西；
            · **流式输出 + 吐字动画**：不是等全部生成完一次性蹦出来，是像人在打字；
            · 空对话时给四个现成问法（这题考什么 / 为什么这答案对 / 讲讲原理 / 出几道同类题练练）。

            **换题时对话会自动清空**——上一题的上下文还挂在脑子里，留着只会串。

            ### 默认接 DeepSeek，但换谁都行

            走的是 OpenAI 兼容格式，所以 Kimi / 通义 / 本地 Ollama 改个地址和模型名就能用。
            设置在：**设置 → AI 助手**，是一行入口点进去的弹窗——
            你说过主设置已经很长，所以配置项一个都没往那儿平铺。

            弹窗里有：API Key、接口地址、模型名、**带入最近几轮对话**（0 = 只带当前题）、
            创造性、单次回复上限、自定义人设，外加一个**「测试连接」**按钮——
            填完先点它，通了再存，免得存完发现填错了。

            **Key 只存在你本机**，不上传任何第三方（除了你自己填的那家接口）。

            ### 其余一切照旧

            模考即时判定与锁定、多选漏选/错选标注、底栏模糊、更换壁纸，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.24-preview.apk` **覆盖安装**即可，学习数据自动迁移。
