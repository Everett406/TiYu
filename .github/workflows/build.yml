name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.17.0
  APP_VERSION_TAG: v2.17.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.17.0

            ### 修好了：模考不抽多选题

            你反馈的「题库有多选、考试却只出单选」是真 bug，已定位并修复。

            根因：模考配置页早就修过「题型排序不是白名单」，但真正抽题的那一步漏了——
            它把你在别的题库里拖出来的题型排序当成了「只抽这几类」的白名单。
            于是配置页算好 50 题（单选 25 + 多选 25）、按钮也显示「共 50 题」，
            真抽的时候多选那 25 道一次都没被抽走。多选拉满 100% 时更是直接抽成空卷，
            考试页一片空白还交不了卷。

            这不是多选一家的事：填空、简答同样会被丢，只要它们不在那份旧排序里。
            刷题功能不受影响（它取的是当前题库实际有的题型）。

            已在四种场景下验证：全新安装、切换过题库、多选拉满、五种题型齐全的题库，
            计划抽题数与实际抽题数现在完全一致。

            ### 拍照搜题整体下线

            相机入口、拍照页、结果页、OCR 引擎与模型下载全部移除。
            顺带的收益：工程不再有任何 native 代码，构建不再需要下载 NDK/CMake
            （约 2GB），本地和 CI 都少一步。应用回到纯离线的干净形态。

            ### 渐进式模糊：第三次，换了条路

            之前两次失败我都归因清楚了，这次没走老路：

            这次**不做连续可变半径**，改成用几层「固定半径」的背景模糊叠出渐变斜坡。
            每一层都是系统硬件加速的模糊，Android 12 起可用，不写任何自研着色器。

            已接入：底部过渡带全局生效（所有 Tab 页），顶部过渡带已在首页生效。
            顶部要糊滚动内容又不能糊固定标题，为此新增了一层只包滚动内容的记录层——
            和当初修首启崩溃时的架构约束是一脉相承的。

            如果真机上看不对，回滚这个版本即可，不影响上面两条修复。

            ### 依赖小幅升级

            Room 2.8.5、DataStore 1.2.1、core-ktx 1.17.0。
            Compose / navigation / lifecycle 这几项实测在当前 AGP 8.13.2 上会直接
            构建失败（要求 AGP 9.1+ 与 compileSdk 37），留待专门的工具链升级轮，
            README 已写清边界。

            ---

            **安装**：下载下方 `TiYu-2.17.0.apk` 安装覆盖即可，学习数据自动迁移。
