name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.18.0
  APP_VERSION_TAG: v2.18.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.18.0

            ### 渐进式模糊重做——上一版真机不合格，这次换掉

            你反馈的满屏横线和底栏糊穿，是我上一版的实现问题，两处都是自找的：
            我在玻璃层里画了实色矩形当"纱"，它的上下边界就是硬边；
            又把过渡带切成三层分别裁剪，每层边界都断开了采样。
            三层叠加，正好六条横贯全屏的接缝。

            本版推翻重做：**一个节点、一次模糊、一条渐变**。
            整条过渡带只跑一次背景采样，带内不做任何切分，
            可见性全靠一条渐变蒙版从「全是模糊」过渡到「原图」。
            靠近栏体处几乎全是模糊，往内逐渐透出原图——就是你要的那个手感。
            比上一版还少两层离屏合成，理论上也更快。

            ### 新增：模考即时判定（可选）

            模考配置页 → 高级选项 → 多了一个「即时判定」开关，**默认关闭**。

            - **关闭**（默认）：全卷交卷后统核正误，和以前一模一样；
            - **开启**：选完当场亮对错。单选、判断点一下就判；
              多选因为是勾选切换、不是一次作答，所以选好后点「确认本题」才判。
              判完这题就锁定不改了，否则当场验得失就没意义。
              题卡顶部会给出判定结论、正确答案和解析。

            模考结构、倒计时、答题卡、交卷流程一概不变。
            **只改显示时机，不改判分口径**——当场判定和交卷判分用的是同一个判定函数，
            成绩单的统计完全照旧。

            ### v2.17.0 那两条修复仍在

            模考不抽多选题的 bug 修复、以及拍照搜题下线，都在。

            ---

            **安装**：下载下方 `TiYu-2.18.0.apk` 覆盖安装即可，学习数据自动迁移。
