name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.22
  APP_VERSION_TAG: v2.19.22

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.22

            ### 修一个你反馈的真 bug：关掉「即时判定」后模考点选项像点不动

            你说得对，这确实是我的锅。查出来了，说清楚怎么回事：

            上一版为了修「关掉即时判定还是当场亮出正确答案」那个问题，
            我把选项的显示判据从 `ua`（有没有作答）换成了 `verdict`（有没有判定）。
            这个改法本身是对的——**但它有个我没想到的副作用**。

            原来那个 `state` 只有三档：默认 / 正确 / 错误。
            「你选中了这一项」和「这一项答对没」是**挤在同一个变量里的**。
            一关即时判定，`verdict` 永远是空的，于是 `state` 永远是「默认」——
            **选中态被一起抹掉了**。答案其实存进去了一点没错，
            但你屏幕上一点变化都没有，看起来当然就是点不动。

            多选题那边没事（它的选中态是单独画的），所以只有单选和判断题会犯。

            ### 现在的做法：把两件事拆开

            · **已判定** → 该绿绿、该红红，答案照旧当场亮
            · **已选中但没判定** → 淡底 + 深边框，**只告诉你"选了这个"，不告诉你对不对**

            所以关掉即时判定之后，点选项**会有明确的选中反馈**，但不会提前泄题，
            交卷再统一判——这就是「全卷交后统核」本来的样子。

            顺带把选中态的配色数值调成跟模考多选那边一致，两处视觉统一。

            ### 其它一切照旧

            底栏模糊（关/轻/重）、更换壁纸点一下直接开相册、上上版的全部改动都在。

            ---

            **安装**：下载下方 `TiYu-2.19.22.apk` **覆盖安装**即可，学习数据自动迁移。
