name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  # IS_PREVIEW=true 时走**草稿预览**通道：APK 内部版本号带 -preview 后缀、
  # versionCode 抬高可覆盖安装线上正式版、Release 以 draft 发布（仓库里可见可下载，
  # 但不对外公开）。验证通过后把 IS_PREVIEW 改回 false、版本号去掉后缀即可正式发。
  IS_PREVIEW: 'false'
  APP_VERSION_NAME: 2.19.28
  APP_VERSION_TAG: v2.19.28

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon ${{ env.IS_PREVIEW == 'true' && '-PtiyuPreview=true' || '' }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          # 预览通道：draft = 仓库内可见可下载，但不会对外公开
          draft: ${{ env.IS_PREVIEW == 'true' }}
          prerelease: ${{ env.IS_PREVIEW == 'true' }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.28

            ### 强调底纹理：整片铺开，不只是按钮

            你指的那几处（分段控件的滑块、筛选 chip、开关的轨道）现在都有纹理了。
            一共五类「实心强调底」统一走同一套：

            · 首页「继续刷题」这类主按钮
            · 「顺序 / 随机」的**滑动指示块**
            · 错题本筛选 chip「全部 / 单选 / 判断」的选中态
            · 刷题配置 chip 的选中态
            · 开关打开时的轨道

            ### 深浅两套纹理自动切换

            强调底在任何主题下都是那个 `ui.ink`——浅色模式它是**墨黑**，深色模式它是**浅米色**。
            所以判据只要认这一个值就行：

            · 浅色模式 → **星空**（你给的那张）
            · 深色模式 → **水磨石**（你给的这张）

            一行判据同时管住两种主题，不用在每个地方写「如果是深色模式就怎样」。

            ### 开关是渐显的

            开关的纹理跟手——你拖滑块的时候纹理跟着渐显，跟以前颜色插值的手感一样，
            不是啪一下跳出来。

            ### 筛选 chip 的描边调淡了一档

            选中态描边原来是纯墨色，压在纹理上有点硬；现在 55% 透明度，观感更透气。

            ### 其余一切照旧

            星点减 30%、依赖升级、多选漏选/错选标注、模考即时判定，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.28.apk` **覆盖安装**即可，学习数据自动迁移。
