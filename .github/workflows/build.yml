name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.16
  APP_VERSION_TAG: v2.19.16

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.16

            ### 选项那个圈里的字母，原来是歪的

            原因不难找，但也没法靠"往上挪一点"糊弄过去：
            Android 默认会给中日韩字形预留上下留白（`includeFontPadding`），
            那个圈才 24dp，留白一撑，行盒就高了，行盒再居中——
            **被压下去的是字形本身**。

            现在把那层留白关掉，行高也收到跟字号一样，字才真正落在圆心上。

            ### 判断题的勾和叉，重新画了

            原来用的是字符 `√` 和 `×`。`√` 其实是**根号**，不是对勾；
            `×` 的粗细还跟着系统字体走——所以你说太细、不好看，是有道理的。

            现在两个符号都用画笔画出来：圆头圆角、粗细固定，
            两个符号的视觉重量也一致了。

            **ABCD 没动**，还是原来的字母——你说不用自己画，那就别画。

            ### 其他一切照旧

            热力图与浮窗、卡片高度锁定、渐进模糊（已移除）、顶栏原样、
            模考即时判定、拍照搜题下线，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.16.apk` **覆盖安装**即可，学习数据自动迁移。
