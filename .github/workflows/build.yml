name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.11.5
  APP_VERSION_TAG: v2.11.5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.11.5

            ### 修复 —— 顺序刷题末题续轮：告别「进度丢了吗？」（第四十四轮）

            - 刷到最后一题（或跳题做完末题）后，答对时**自动跳到本轮第一个没刷过的题**，
              不再停在末题不动；答错停在末题看完解析后，点「下一题」同样续刷未做的题。
            - 此前行为：末题做完原地停留，退出重进才开「补漏轮」——总题数从 800 变 743、
              从第 1 题重新开始，观感像进度丢失。实际作答记录一直都在（错题本/统计/首页
              进度不受影响），本轮起当场续轮，绝大多数场景不再触发补漏。
            - 补漏轮依然保留（长周期循环刷完全库的兜底）：副标题新增口径标识
              「补漏轮 · 此前已刷 N 题」，总题数变化不再让人误解。

            ---

            **安装**：下载下方 `TiYu-2.11.5.apk` 安装覆盖即可，数据自动迁移。
