name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.18
  APP_VERSION_TAG: v2.19.18

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.18

            ### 先说勾叉为什么"还没生效"

            不是画得不好看——**是考试页压根没调用那段代码**。

            刷题和模考当初是两套各画各的：刷题用共用组件，模考自己内联画了
            一整套选项行。所以我前两版给刷题页画的自绘勾叉，模考里根本没出现。

            ### 考试页现在跟刷题页对齐了

            模考的选项行改成复用同一套组件，于是三处不一致一起好了：

            · 判断题的勾叉出现了（和刷题页一模一样）
            · **答错会有抖动动画**，对错配色、右侧标记也都有了
            · 字号、行高、间距跟刷题页同步了

            ### 解析挪到后面了

            之前是"先看答案再看题"，现在跟刷题页一样：
            **选项 → 判定 → 正确答案 → 解析**，而且是丝滑展开的。

            ### 抽题随机性：找到真凶了

            抽题那步**确实是随机的**，但最后一步排序把随机又抹掉了——
            按题目 ID 排了一遍，于是同一题型内的题目**每次模考顺序都一样**。
            改成只按题型分组（组内保留随机顺序），题型之间的先后仍按你在配置页
            拖的顺序走。

            ### 判分口径没动

            交卷判分仍旧走统一的那套，没动。

            ### 其他一切照旧

            选项字母居中、热力图与浮窗、卡片高度锁定、顶栏原样、
            模考即时判定、拍照搜题下线，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.18.apk` **覆盖安装**即可，学习数据自动迁移。
