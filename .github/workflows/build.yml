name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.11.0
  APP_VERSION_TAG: v2.11.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.11.0
            
            ### 新功能 —— 随机选项（刷题 + 模考，答案绝不乱）
            
            - **刷题**：刷题配置页「题目顺序」卡新增**随机选项**开关。开启后每次开刷，
              选择题的选项顺序都会重新打乱——防「背位置」，只考「会不会」。
            - **模考**：模考配置页「高级选项」新增**随机选项**开关，本场考试选项乱序；
              快速模考（长按图标/小组件）沿用上次开考配置的开关状态。
            - **答案判定绝对不受影响**（结构性保证 + 全量自动化验证）：
              - 打乱只发生在**显示层**；你的每一次作答在落库/判分前都会换算回原始选项位置，
                判分逻辑、错题本、统计数据零改动、零污染；
              - 新增 JVM 单元测试 OptionShuffleTest：单选 500 题 × 穷举所有点选位置、
                多选 500 题 × 穷举所有勾选组合、端到端 300 轮重放——
                **选对的内容 100% 判对，选错的内容 100% 判错，两套空间判定全等**；
              - 同一轮刷题/同一场考试内顺序稳定（翻页回来不会变）；退出再进恢复原顺序；
                重新开始/下次进入重新打乱。
            - **按你的口径**：错题本与错题特训**保持选项原始顺序**，不参与随机；
              判断题（对/错两项）不参与打乱；老进度、进行中的模考升级后完全兼容。
            - 数据库 v4→v5（exam_records 增加选项乱序会话盐列，老数据无损迁移）；
              static_check 新增随机选项机制防删除断言。
            
            安装：下载下方 TiYu-2.11.0.apk 覆盖安装即可，数据全部保留。
