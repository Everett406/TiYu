name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.23
  APP_VERSION_TAG: v2.19.23

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.23

            ### 多选判错时，到底漏在哪、错在哪，现在逐项写清楚了

            你举的例子我复现了一下：勾了 **A、B、C** 漏了 **D**，结果四个选项**全标"正确"**。
            原因是旧版只认「这一项是不是正确答案」——D 是正确答案，所以它也算"正确"，
            哪怕你压根没点它。看着像全对，实际是错的。

            现在每个选项会明确标出属于哪种：

            · 🟢 **正确** —— 勾了，而且确实是答案
            · 🔴 **错选** —— 勾了，但它不是答案
            · 🟠 **漏选** —— 它是答案，但你没勾

            **漏选用琥珀色**是有讲究的：它既是"该勾的"又是"你没勾的"——
            用绿色会和"正确"混，用红色又会被你误读成"你选错了"。
            所以它是唯一的第三种颜色，勾选框是空心的（该勾没勾）。

            另外多选判定区新增一行 **「你的答案：A、B、C」**，
            紧挨在「正确答案：A、B、C、D」上面，两行一对，漏没漏、错没错一眼就清楚。
            （单选和判断题不加这行——错在哪一项会直接红在那个选项上，不用再罗列一遍。）

            模考页的多选也一并同步了同样的标法。

            ### 其它一切照旧

            模考的即时判定与锁定（上版修的）、底栏模糊、更换壁纸，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.23.apk` **覆盖安装**即可，学习数据自动迁移。
