name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.9
  APP_VERSION_TAG: v2.19.9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.9

            ### 「过密」是我把间距写丢了

            上一版我重写这块渲染的时候，格子只写了尺寸、**忘了写行间距**。
            结果一百多个小方块首尾相连，连成一块实心板——就是你看到的「过密」。
            而左边的星期标签却是按「格子 + 间距」排的，两边高度根本对不上。

            这条是我自己的问题：**尺寸和间距分两处写，就一定会漏掉一处。**
            现在改成统一交给排版间距参数管，结构上就不会再犯。

            ### 版式也理了

            - **月份标签「10月」被截成「10」**：列宽不够加上不许换行，就截了。
              现在允许它溢出所在的位置（月份标签本来就稀疏，挤不到别的内容）。
            - **右边空一大块**：上一版我给格子上限卡得太死，13 列填不满卡片。
              现在**周数从 13 改成 18**（约四个月），格子更细、看着更轻，
              上限也放宽了，宽屏照样铺满。取数也跟着从 100 天提到 140 天。
            - **图的右缘有个缺口**：最后那一列原本给「还没到的日子」留着位置。
              现在只画到今天为止，右边干净收口。

            ### 其他一切照旧

            分档只看当天题量不看正确率、今天描边、过渡带 32dp、Agora 原版九抽头、
            顶栏原样、五个页签都有底缘模糊、模考即时判定、拍照搜题下线，全都在。

            ### 说句实在的

            这是同一张卡第三轮排版修改了。前两轮都是我在沙箱里凭想象写、你在真机上挨个
            试出来再回来报——效率很低。所以这轮我一条条对着你截图核的，
            并且把「间距丢失」「标签截断」「取数不足」都写成了自动检查，
            以后再犯会直接拦下来。

            下一轮如果还有问题，继续截图给我。

            ---

            **安装**：下载下方 `TiYu-2.19.9.apk` **覆盖安装**即可，学习数据自动迁移。
