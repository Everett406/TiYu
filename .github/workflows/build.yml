name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.21
  APP_VERSION_TAG: v2.19.21

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.21

            ### 「更换壁纸」改回原来的样子

            v2.19.20 我给它加了个二级面板，让你先选「从相册选取」还是「同步系统壁纸」。
            你反馈不需要——**已整体撤回**，现在回到最直接的做法：

            **点「更换壁纸」直接开系统相册选择器**，一步到位，跟以前一样。

            顺带说清楚另一件事：v2.19.20 那次我在清单里加了「**所有文件访问权限**」
            （MANAGE_EXTERNAL_STORAGE），是为了读系统壁纸。**这次一并撤掉了**——
            清单里现在没有任何敏感权限，回到了「干净」状态。

            同步系统壁纸那套代码我留在 `WallpaperSync.kt` 里没删，但**没有任何入口**，
            也不声明权限，等于不存在。以后你要是又想用它，说一声我直接接回去，不用重写。

            ### 上一版的「底栏模糊」改动全部保留

            「底栏玻璃模糊」→「底栏模糊」，液态玻璃下是 **关 / 轻 / 重**
            （「关」是真的不挂模糊效果的纯玻璃），亚克力仍是 低 / 中 / 高。

            ### 其它一切照旧

            即时判定开关、模考与刷题页对齐、抽题随机性、热力图与浮窗、顶栏原样，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.21.apk` **覆盖安装**即可，学习数据自动迁移。
