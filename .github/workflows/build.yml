name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.11.2
  APP_VERSION_TAG: v2.11.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.11.2

            ### 调整 —— 关闭画面特效改为「亚克力模糊」（第四十一轮）

            - 设置页「画面特效」关闭后，不再进入果冻模式（goo 融合动效：
              底栏液态拖尾、按钮按压液泡、滑杆/开关液滴融合、弹窗过冲等全部移除），
              改为**干净的亚克力毛玻璃**：表面只做模糊，所有交互回归正常动画手感。
            - 液态玻璃模式（特效开启）完全不受影响，渲染路径一字未动。
            - 崩溃兜底的安全平涂模式同样不受影响。
            - 设置页副标题由「果冻模式 · 省电」更新为「亚克力模糊 · 省电」。
            - 实现面：果冻渲染管线（AGSL/ColorMatrix goo 管线）整体删除，
              底栏选中胶囊改普通 spring 跟随、按钮改亚克力胶囊+按压缩放、
              滑杆/开关改实色滑块、弹窗统一 spring 手感；系统「减弱动画」
              无障碍降级保留。static_check 新增 goo 残留禁令防复活。

            ---

            **安装**：下载下方 `TiYu-2.11.2.apk` 安装覆盖即可，数据自动迁移。
