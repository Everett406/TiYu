name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  # IS_PREVIEW=true 时走**草稿预览**通道：APK 内部版本号带 -preview 后缀、
  # versionCode 抬高可覆盖安装线上正式版、Release 以 draft 发布（仓库里可见可下载，
  # 但不对外公开）。验证通过后把 IS_PREVIEW 改回 false、版本号去掉后缀即可正式发。
  IS_PREVIEW: 'true'
  APP_VERSION_NAME: 2.19.26-preview
  APP_VERSION_TAG: v2.19.26-preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon ${{ env.IS_PREVIEW == 'true' && '-PtiyuPreview=true' || '' }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          # 预览通道：draft = 仓库内可见可下载，但不会对外公开
          draft: ${{ env.IS_PREVIEW == 'true' }}
          prerelease: ${{ env.IS_PREVIEW == 'true' }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.26-preview（草稿预览版 · 第 3 稿）

            > **这是一个 draft 预览版**：你能看到、能下载，但它**没有公开发布**。
            > 验证没问题后我再走正式发布。

            ### 这稿修的（其中第 1 条是真 bug，之前是我写错了）

            **1. AI 的回复跑进了你的提问框里** —— 这是我的锅，代码写错了。
            一句话解释：`slot` 本身已经是 AI 消息的下标，我又多减了一次 1，
            结果每个字都追加到了**你那条消息**上。所以你看到的是一个巨大的黑色气泡，
            前半句是你的问题、后半句是 AI 的回答。

            （顺带一提：截图里 `**` 没被渲染，恰恰是这个 bug 的破绽——
            你的气泡本来就不做 Markdown 处理，而 AI 回复是渲染的。）

            **2. 配置页左右还是没留白** —— 上一版我只给聊天面板加了，配置页漏了。这次补上。

            **3. 聊天窗口太憋屈** —— 两件事一起做了：
            · 对话区默认从 360dp 提到 **440dp**，内容少的时候自动变矮，不空占屏幕；
            · **小把手现在可以往上拉了**，最多再加 300dp。往下拉还是原来的下滑关闭。

            ### 上一稿（v2.19.25-preview）的改动仍然有效

            思考过程可见 / 折叠成「已思考 N 秒」、吐字去光标、输入框与按钮对齐、
            Markdown 正确渲染 + 公式降级。想看思考记得把模型换成 `deepseek-reasoner`。

            ### 其它一切照旧

            ### 其余一切照旧

            模考即时判定与锁定、多选漏选/错选标注、底栏模糊、更换壁纸，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.24-preview.apk` **覆盖安装**即可，学习数据自动迁移。
