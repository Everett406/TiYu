name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.19
  APP_VERSION_TAG: v2.19.19

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.19

            ### 即时判定关掉了还在判——这是我上一版搞坏的

            上一版我把模考的选项改成复用刷题页那套，判据直接抄了刷题页的写法。
            结果发现**两边那个「已作答」根本不是一回事**：

            · 刷题页：点选项只是选中，**提交之后**才算作答
            · 模考页：**点一下就算作答**

            所以模考里一点，`作答` 立刻就有了，答案当场被点亮——
            那个"要不要当场判定"的开关被绕过去了。

            还有一个更严重的、我一并修了：上一版还把"提交后不可改"的规矩带了过去，
            等于**模考里选中答案后就不让改了**。现在恢复成可以改。

            **教训**：复用组件时，同名状态在两个页面的含义未必相同。
            这是第二次栽在跨页复用上，写进检查脚本了。

            ### 配置项那行小字，两行看着很难受

            按你说的，**不管开关是开是关，小字都不超过 10 个字**：

            · 开：逐题作答，当场验正误
            · 关：交卷后统核正误

            同一张卡片里"含简答题"和"题型顺序"两行也是一样的毛病（16 字、20 字），
            一并收成 9 字。另外都加了省略号兜底，以后文案再变长也不会换行。

            ### 其他一切照旧

            考试页与刷题页对齐、抽题随机性、自绘勾叉、热力图与浮窗、
            卡片高度锁定、顶栏原样、拍照搜题下线，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.19.apk` **覆盖安装**即可，学习数据自动迁移。
