name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  # IS_PREVIEW=true 时走**草稿预览**通道：APK 内部版本号带 -preview 后缀、
  # versionCode 抬高可覆盖安装线上正式版、Release 以 draft 发布（仓库里可见可下载，
  # 但不对外公开）。验证通过后把 IS_PREVIEW 改回 false、版本号去掉后缀即可正式发。
  IS_PREVIEW: 'false'
  APP_VERSION_NAME: 2.19.41
  APP_VERSION_TAG: v2.19.41

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # v2.19.36：生成历程数据需要完整历史（默认 fetch-depth:1 只有最后一个提交，
          # 会让 AppHistory 只剩当前版本一条）。已足够浅，又不拖慢构建。
          fetch-depth: 0

      - name: Regenerate app history
        # v2.19.36：历程表改为每次发版自动重生成，不再靠人记得手跑脚本。
        # 脚本幂等——git 历史没变时输出与仓库内文件一致，重生成不会产生噪声 diff。
        # 真正被更新的 AppHistory.kt 会随 tag 提交记录在案。
        run: python3 scripts/gen_history.py && git --no-pager diff --stat -- app/src/main/java/com/drone/quiz/data/AppHistory.kt || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon ${{ env.IS_PREVIEW == 'true' && '-PtiyuPreview=true' || '' }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          # v2.19.41：再存一份**不带版本号**的固定名资产。
          # releases/latest/download/ 只认固定名——有了它，产品页和任何外部
          # 直链都能写死 TiYu-latest.apk，不必跟着版本号改。
          # 仅正式版更新它：preview/draft 不该抢"最新"这个位置。
          if [ "${{ env.IS_PREVIEW }}" != "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/TiYu-latest.apk
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          # 预览通道：draft = 仓库内可见可下载，但不会对外公开
          draft: ${{ env.IS_PREVIEW == 'true' }}
          prerelease: ${{ env.IS_PREVIEW == 'true' }}
          files: |
            dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
            dist/TiYu-latest.apk
          body: |
            ## 题屿 TiYu v2.19.41

            ### 模考设置记住了

            以前每次进来都要重调一遍——现在**沿用上次的设置**，
            顶部会有提示，右边有「恢复默认」。

            顺带说一句根因：设置其实**一直有在存**（桌面小组件那个「快速模考」
            就靠它），但模考配置页打开时从来不去读——滑杆用的是写死的初始值，
            而开关是能记住的。所以是「开关记住了、滑杆没记住」。

            ### 有产品发布页了

            **everett406.github.io/TiYu**

            介绍、能干什么、常见问题、下载入口、题库版权说明，都在上面。

            App 里点「GitHub 发布页」现在直接进这个页面。
            （页面打不开会自动退回原来的版本列表，不会把你卡在空白。）

            下载按钮用的是**固定链接**，永远指向最新正式版——
            以后发版，链接不用改。

            ### 其余一切照旧

            解析折叠 + 逐字对焦、时间轴连线、顶栏按钮齐平、选项打乱、
            错题优先、优先未答，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.41.apk` **覆盖安装**即可，学习数据自动迁移。

  # 产品发布页（v2.19.41）：静态站，GitHub Pages 托管，零成本零服务器。
  #
  # 部署方式必须与仓库 Pages 设置一致：已开通为 **legacy + gh-pages 分支**
  # （build_type=legacy），故推分支而非 upload-pages-artifact 那套 Actions
  # 环境——两者混用会互相打架（一个报 "Pages is already enabled"，
  # 另一个推完不生效）。
  #
  # 为什么还要 CI 推一遍、而不是只靠本地 subtree：页面里的下载直链与 App 版本
  # 相关，发版时一起更新才不会页面与 APK 对不上。
  pages:
    name: Deploy product site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # subtree split 需要完整历史
          fetch-depth: 0

      - name: Publish site to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=site -b _site
          git push --force origin _site:gh-pages
          git branch -D _site
