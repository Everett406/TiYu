name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  # IS_PREVIEW=true 时走**草稿预览**通道：APK 内部版本号带 -preview 后缀、
  # versionCode 抬高可覆盖安装线上正式版、Release 以 draft 发布（仓库里可见可下载，
  # 但不对外公开）。验证通过后把 IS_PREVIEW 改回 false、版本号去掉后缀即可正式发。
  IS_PREVIEW: 'false'
  APP_VERSION_NAME: 2.19.27
  APP_VERSION_TAG: v2.19.27

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon ${{ env.IS_PREVIEW == 'true' && '-PtiyuPreview=true' || '' }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          # 预览通道：draft = 仓库内可见可下载，但不会对外公开
          draft: ${{ env.IS_PREVIEW == 'true' }}
          prerelease: ${{ env.IS_PREVIEW == 'true' }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.27

            ### 星点减 30%

            那个星空底纹按你说的减了三成。没重新生成任何星点，
            只是把每个像素相对底色的"亮出量"整体压到 72%——
            最暗的那批星点自然沉进黑底，看着就不那么满了。

            ### 依赖查了一遍，能升的升了，升不了的说明白

            **已升**：

            · `kotlinx-coroutines` 1.10.2 → **1.11.0**
            · `kotlinx-serialization-json` 1.9.0 → **1.11.0**（跳过了 1.12.0-RC 预发布）
            · `core-ktx` 1.17.0 → **1.18.0**
            · `lifecycle` 2.9.4 → **2.10.0**
            · `activity-compose` 1.12.4 → **1.13.0**

            `room` 2.8.5 与 `datastore` 1.2.1 本来就是最新，没动。

            **升不了的三项**（新版强制要求 **compileSdk 37 + AGP 9.1**，
            我们是 36 + AGP 8.13.2，硬升会直接构建失败）：

            · `core-ktx` 1.19.1
            · `lifecycle` 2.11.0
            · `navigation-compose` 2.10.2

            **`compose-bom` 也没升**（2025.06 → 2026.09 跨了 15 个月）。
            液态玻璃那套是源码内联的，重度依赖实验性 API，
            大版本 Compose 的变动最可能砸在那儿；而且这种改动值得单独一版试，
            不该和其它改动混在一起。

            ### 液态玻璃（kyant backdrop）：查了，不用更新

            上游最新 **2.0.1**，我们内联的这版**签名已经和它一致**
            （`lens()` 的 `depthEffect` / `chromaticAberration` 参数都在）。
            而且我们这份**比上游还多两层防御**：不支持的形状直接跳过、
            AGSL 编译失败降级——说明之前踩过坑加固过。
            换成官方版反而会把这两层保护弄丢。

            `shapes` 我们内联的 1.2.1 **本来就是最新**。

            ### 顺带修了沙箱的一个老毛病

            沙箱里 Gradle 一直拉不到新依赖（Java 证书链跟出网代理对不上，curl 却能通），
            所以以前任何依赖升级都**没法本地验证**，只能靠 CI 试错。
            这轮把沙箱网关 CA 导进了独立 truststore，本地终于能编译验证了——
            上面那几个"升不了"就是本地一眼看出来的，不是猜的。

            ### 其余一切照旧

            多选漏选/错选标注、模考即时判定与锁定、更换壁纸，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.27.apk` **覆盖安装**即可，学习数据自动迁移。
