name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  # IS_PREVIEW=true 时走**草稿预览**通道：APK 内部版本号带 -preview 后缀、
  # versionCode 抬高可覆盖安装线上正式版、Release 以 draft 发布（仓库里可见可下载，
  # 但不对外公开）。验证通过后把 IS_PREVIEW 改回 false、版本号去掉后缀即可正式发。
  IS_PREVIEW: 'false'
  APP_VERSION_NAME: 2.19.25
  APP_VERSION_TAG: v2.19.25

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon ${{ env.IS_PREVIEW == 'true' && '-PtiyuPreview=true' || '' }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          # 预览通道：draft = 仓库内可见可下载，但不会对外公开
          draft: ${{ env.IS_PREVIEW == 'true' }}
          prerelease: ${{ env.IS_PREVIEW == 'true' }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.25

            ### AI 助手整个拿掉了

            上一版我自作主张把「问 AI」转成了正式版——**这次撤回**，
            现在回到干净的离线状态：

            · 刷题页每题底部的「问 AI」入口已删
            · 设置页的「AI 助手」入口已删
            · 全部 AI 代码（客户端、聊天面板、设置面板、Markdown 渲染、思考计时）已删
            · SettingsStore 里的 API Key / 接口地址 / 模型 / 上下文轮数等配置已删
            · **OkHttp 依赖一并撤掉**（网络层本来只有 AI 在用）

            应用回到「**零联网依赖**」的纯离线形态。

            ### 但 INTERNET 权限留着——这个有别的用途

            别看有 AI 被删了就把网络权限也去掉：**应用更新检查还在用它**
            （`AppUpdater` 拿最新版版本号）。所以 `INTERNET` 权限保持原样，
            只是不再有任何 AI 相关的网络请求。

            ### 上一版的崩溃修复保留

            多选题那个 NPE（切题库后滚到没答过的多选题必崩）是 v2.19.23 引入的，
            **与 AI 无关**，已修且继续生效。全工程无 `ua!!`。

            ### 其余一切照旧

            多选漏选/错选标注、模考即时判定与锁定、底栏模糊、更换壁纸，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.25.apk` **覆盖安装**即可，学习数据自动迁移。
