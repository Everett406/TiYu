name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.16
  APP_VERSION_TAG: v2.19.16

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.17

            ### 上一版那两个符号，我画砸了

            你说"极丑无比，而且还不居中"——是我自己拍的坐标不对。

            而且"不居中"这件事**不是挪一挪就能修好的**。我算的时候勾的路径包围盒
            确实是居中的，可**包围盒居中不等于看着居中**：勾的长臂墨量比短臂大得多，
            整块墨的重心被拽到左下，看着就是歪的。再叠上圆头描边向外扩那半圈，
            偏得更多。

            现在改成**实心画**——不是拿线条描，是把形状本身填出来，
            在标准比例里画好再等比缩放。这样两个符号都以中心对称，粗细也固定，
            不再受系统字体影响。

            顺带记一条教训进代码注释：**图形不能靠"算个中心摆上去"**，
            得看形状自身的分量分布，尤其是勾、箭头这类不对称形状。

            ### 其他一切照旧

            选项字母的居中（Android 那个中日韩留白已关掉）、热力图与浮窗、
            卡片高度锁定、顶栏原样、模考即时判定、拍照搜题下线，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.17.apk` **覆盖安装**即可，学习数据自动迁移。
