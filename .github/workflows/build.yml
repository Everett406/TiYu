name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.12
  APP_VERSION_TAG: v2.19.12

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.12

            ### 底部那片模糊，去掉了

            你说干脆完全去掉——就去掉了。不是调参数，是**整个功能连代码一起删**。

            这是渲染层最长的一条弯路，四个版本、试了十几次，最后整条路作废：

            · 最早是蒙版和雾条，和玻璃卡的离屏渲染打架，一片闪；
            · 后来自己写着色器让半径连续变化，太贵了；
            · 再后来分层叠加，每层一个裁剪边，满屏横线，底栏还糊穿；
            · 最后照搬 Agora 的九抽头，把接缝解决了，但你嫌它耗电、观感也不对。

            **关键的一句在这儿**：底栏玻璃本来折射的就是**已经模糊过的内容层**，
            所以去掉这层东西**视觉上一点不缺**。而它每帧要在整个滚动区域跑两趟
            着色器，是全 App 最贵的一处绘制。省下来的是真金白银的电量。

            代码已经删干净了（不是注释掉）。我在检查脚本里加了一道锁，
            以后谁想把它加回来会直接被拦下。

            如果哪天你觉得底下该有点糊效果了，**先想清楚它在解决什么问题**——
            这个前提到现在还没被证明过。

            ### 格子详情：改成轻点出窗

            你说得对，长按不对。手机上没有"移上去"，**轻点**才是最接近的。
            长按既不直觉，还会跟列表的长按滚动打架。

            现在轻点任意一格（包括没练过的），就浮出这样一个小窗：

            ```
            ┌──────────────┐
            │ 10月8日 · 答了 32 题 │
            │ 正确率 81%          │  ▼  ← 三角指着格子
            └──────────────┘
            ```

            默认浮在格子上方，顶到卡片上缘就翻到下方，左右不会跑出图外。
            **再点同一格收起**，点别的格就移过去，4 秒后自己消失。

            上一版为什么只有黑框没有窗？我写了个死循环：要先量到窗的尺寸才渲染它，
            而不渲染就量不到尺寸——鸡生蛋，卡死了。现已修掉。

            ### 其他一切照旧

            热力图本身你说没问题，那就没动。过渡带已随之移除，
            顶栏原样，五个页签，模考即时判定，拍照搜题下线，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.12.apk` **覆盖安装**即可，学习数据自动迁移。
