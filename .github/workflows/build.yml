name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.8
  APP_VERSION_TAG: v2.19.8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.8

            ### 你截图里那几个毛病，都修了

            **一、热力图右边空了一大块。** 我把格子尺寸写死成 13dp 了，
            卡片比它宽出一截。现在改成按卡片实际可用宽度反算列距，13 列正好铺满。
            以后换手机、换屏幕宽度，它自己会跟着变。

            **二、左边那个「日」跑到第 4 行去了。** 我写成四个标签依次往下堆，
            只给最后一个写字——所以「日」落在了错的行上。现在按行号取，一三五日各归各位。

            **三、月份标签被切了。** 那个小标签我给了个固定高度，字比框高，
            下半截被裁没了。现在高度让文字自己决定。

            **四、上面两半高低不齐。** 左边「连击」一行、右边「今日」两行，
            一居中就对不齐了。现在左右做成一样的结构——都是「小标签 + 大数字」，
            顶端对齐，正确率挂在今日题数右边当绿色百分比，不再单独占一行。

            顺带把今天那格的描边加粗了（原来 1dp，在高分辨率屏上几乎看不出来），
            图例的色块也放大了一点点。

            ### 热力图逻辑没动

            13 周、分档只看当天题量不看正确率、今天描边、未来的日子留空，
            都是上一版说好的，原样。

            ### 其他一切照旧

            过渡带 32dp、Agora 原版九抽头、顶栏原样、五个页签都有底缘模糊，
            模考即时判定、模考不抽多选题、拍照搜题下线，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.8.apk` **覆盖安装**即可，学习数据自动迁移。
