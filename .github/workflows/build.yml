name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.11
  APP_VERSION_TAG: v2.19.11

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.11

            ### 卡片矮了，右边那根条也修方了

            **卡片过高**：格子尺寸是由宽度决定的，要矮下来只能缩小格子，
            要同时保持铺满就只能加列。周数 18 → 22，格子从 13dp 降到 10dp，
            整块矮了约 21dp。26 周试算过，格子只剩 8dp 太小，没用。

            **右边那列被挤压**：找到根因了——列宽原先是**由外层自动分配**的，
            18 列加起来比可用宽度多出零点几个像素，最后一列就分不到足够宽度被压扁。
            现在改成每一列**自己声明固定宽度**，取整后总宽严格不超过可用宽度，
            谁也挤不到谁。顺带把月份标签也对齐了（原来标签行和格子行的间距算法不一致）。

            ### 长按格子看当天详情

            手指按住任意一格（包括没练过的），指尖旁边会浮出一张小窗：

            ```
            10月8日 · 周三
            答了 32 题 · 正确率 81%
            ```

            默认浮在格子上方，顶到卡片上缘就改浮下方，左右不会跑出图外。
            两秒半后自己消失。轻点不触发，免得跟列表滚动打架。

            为了显示当天答对数，数据层多带了一个字段——**没动数据库结构**。

            ### 底栏渐隐减效了

            模糊半径 6dp → 4dp，过渡带 32dp → 26dp，五个页签一起生效。

            **但有句实话得说**：这只是让它更淡，**不等于更省电**。耗电的大头是
            模糊每帧要在整个滚动区域跑两趟，过渡带只占一小条，抽头数是固定的，
            半径变小并不会少跑几次采样。真要省电只有一条路——砍掉一趟只留纵向，
            代价是模糊会变成竖向拉丝。**要不要这么做你说了算，我没擅自改。**

            ### 其他一切照旧

            分档只看当天题量不看正确率、今天描边、过渡带、Agora 原版九抽头、
            顶栏原样、模考即时判定、拍照搜题下线，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.11.apk` **覆盖安装**即可，学习数据自动迁移。
