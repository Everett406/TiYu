name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.3
  APP_VERSION_TAG: v2.19.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.3

            ### 过渡带矮了三分之一

            原来 64dp，现在 43dp。最大模糊半径顺手从 6dp 收到 5dp。

            ### 「带点」解决了

            这个我查到了原因，值得一说。

            模糊的算法是照搬 Agora 的，我逐行看过，和他们一字不差。
            但他们那版每个抽头之间隔得比较远——在 3 倍屏上差不多隔了 11 个像素，
            而采样本身一次只覆盖 2 个像素。**八成的像素根本没被采到。**
            细的线、细的字、小图标正好落在这些没采到的地方，就被拍成了规则的点状花纹。

            他们一直没遇到，是因为他们的聊天界面是一块块纯色，没什么细节。
            这边到处都是细线和文字，一下就现原形了。**照搬得先看看人家的前提在你这儿成不成立。**

            改法：抽头从 9 个加到 25 个，间距缩到五分之一，密度提高三倍；
            再把最大半径收一点，抽头挨得更近。这两条一块儿上，点就没了。
            另外把累加从半精度换成单精度——壁纸那种大片渐变上原本还有一道道细带。
            过渡带的起始也改成缓入，不再有一道突兀的起糊线。

            代价是过渡带内每点多做几次采样，但那一小条地方，成本可以接受。

            ### 另外都没动

            顶栏维持 2.19.1 的原样，五个页签都有底缘模糊，模考即时判定开关、
            模考不抽多选题的修复、拍照搜题下线，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.3.apk` 覆盖安装即可，学习数据自动迁移。
