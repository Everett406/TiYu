name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.0
  APP_VERSION_TAG: v2.19.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.0

            ### 渐进式模糊——第四次，换了一条完全不同的路

            你说得对，前三版方向就错了。这次不再小修，直接换掉整条路线。

            之前的做法都是「在栏体上糊一层背景」，这次改成
            **直接模糊滚动内容本身**：给滚动区挂一个半径随距离变化的模糊，
            越靠近栏体越糊。栏体是画在上面的独立玻璃件，永远锐利。

            这样一改，全过程只剩一层、一个效果，接缝根本无从产生——
            前三版那堆横线和糊穿，就是层数堆出来的东西。

            模糊的算法也借了 Agora（newo-ether/Agora）的 GradientBlur：
            9 抽头可分离核，横竖两趟，每像素 18 次采样，没有动态循环。
            他们代码注释里写了原因——之前用稠密网格还每抽头算指数，
            对滚动列表来说太贵了。另外半径接近零时会直接跳过采样，
            所以过渡带以外的地方几乎不花钱。Android 13 起生效，
            12 及以下自动降级为渐隐。

            ### 顶栏现在是悬浮玻璃条

            首页的「晚上好 + 题库切换 + 设置」从固定标题改成了跟底栏一样的悬浮玻璃条，
            浮在内容上面。内容从它底下滚过去，贴着它慢慢变糊。
            斜坡的起点也按悬浮条的内缘对齐了，不会再出现「没贴顶」。

            ### 上一版的东西都还在

            模考即时判定开关、模考不抽多选题的修复、拍照搜题下线，都在。

            ---

            **安装**：下载下方 `TiYu-2.19.0.apk` 覆盖安装即可，学习数据自动迁移。
