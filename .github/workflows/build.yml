name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.10
  APP_VERSION_TAG: v2.19.10

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.10

            ### 那几处都收拾了

            **一、右边那根孤零零的竖条。** 上一版我让最后一列「只画到今天」，
            本周才过几天，那列就只剩几格，跟旁边整块脱节。现在把还没到的日子
            按最浅的颜色画上去，整张图永远是规整的一个矩形，末列和旁边的连成一体。
            （GitHub 就是这么处理的。）

            **二、左边那栏星期砍了。** 你说可有可无，那就砍。砍掉之后格子横向宽了 14dp，
            整张图更饱满。周一在顶，不用标也读得出来。

            ### 三、那两条数字——你说得对，本来就没说清

            问题不只是"没标签"，而是：**它们本来就是同一份数据，摆了两遍。**
            答对 28 + 答错 12 = 今日 40 题，28 ÷ 40 = 70%。

            而且 70% 光秃秃挂在题数后面，你根本不知道那是什么的比例；
            「答对 28 · 答错 12」也没说是哪一天的，跟上面的「今日」隔着一段。

            现在改成左右**三行一模一样**的结构：

            ```
            🔥 连击                    今日 ✓
            3 天                       40 题
            再练 4 天达成 7 天         正确率 70%
            ```

            注解都自带主语和单位。「再练 4 天」那行本来就在讲连击，
            我把它从底部挪到了连击正下方——之前它跟「答对/答错」抢同一行，才是真乱。

            底部只剩一句说全的「今日答对 28 · 答错 12」，图例也挪到了这行右边，
            不再单独吊在矩阵下面。

            ### 其他一切照旧

            分档只看当天题量不看正确率、今天描边、18 周、过渡带 32dp、
            Agora 原版九抽头、顶栏原样、五个页签都有底缘模糊、
            模考即时判定、拍照搜题下线，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.10.apk` **覆盖安装**即可，学习数据自动迁移。
