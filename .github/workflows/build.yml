name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.20
  APP_VERSION_TAG: v2.19.20

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.20

            ### 「底栏玻璃模糊」改叫「底栏模糊」，档位也重做了

            **液态玻璃**下是三档：

            · **关** —— 纯玻璃，一点都不糊（这一档是真的不挂模糊效果的）
            · **轻**
            · **重**

            你说"低""中"太直白，所以改成了描述模糊轻重的单字。

            **亚克力**那边不动，还是 **低 / 中 / 高**，和以前一样。

            顺带把副标题也按两种模式分开写了，都加了省略号，不会再换行。

            ### 更换壁纸：进二级页面选来源

            采纳你的第二个方案——卡片右上角不再塞按钮（屏幕就那么宽，挤进去肯定难看），
            现在点「更换壁纸」会弹出一个面板，两个来源：

            · **从相册选取** —— 不用任何权限，选完就换上
            · **同步系统壁纸** —— 直接沿用手机当前那张

            ### 有件事得先说清楚：Android 13 起不让应用读壁纸了

            这是系统的硬限制，不是我偷懒：

            · Android 13：调用接口返回的是**系统自带的默认壁纸**，不是你那张
            · Android 14：直接抛异常

            官方文档写得很清楚，只有拿到了「**所有文件访问权限**」的应用才能读到真实壁纸。

            所以我按官方的路子做了：**不主动弹窗要权限**——只有你主动点
            「同步系统壁纸」时，它才检查一下。没开就提示一句，并把你送到系统的
            权限页面；**开好之后回来再点一次，就能同步了**。这个权限在系统设置里随时能收回，
            不影响 App 其他任何功能。

            如果你不想给这个权限，那就用「从相册选取」——效果其实一样，只是多选一次。

            另外**没加"相机拍摄"**：拍照搜题那块功能之前下线时把相机权限整个撤了，
            而且"拍一张自己屏幕的照片当壁纸"本身也没意义。你要是想要我再加。

            ### 其他一切照旧

            即时判定开关、模考与刷题页对齐、抽题随机性、热力图与浮窗、顶栏原样，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.20.apk` **覆盖安装**即可，学习数据自动迁移。
