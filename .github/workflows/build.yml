name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.7
  APP_VERSION_TAG: v2.19.7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.7

            ### 主页打卡卡换了张脸

            连击从「一个数字 + 一根倒计时条」变成 **13 周热力图**，
            跟 GitHub 那个贡献图一个形状：一列一周，一格一天，颜色深浅看当天做了多少题。

            原来那半张卡塞不下，所以连击和今日并排的两半合并成了**一张全宽卡**：

            · 顶行左边 `🔥 连击 12 天`，右边 `今日 38 题 · 68%`
            · 中间 13 周热力图，**今天那一格描了边**，扫一眼就知道今天打卡没
            · 底行脚注

            颜色**只看当天做了多少题**，不看正确率。低正确率的日子要是染成暗红，
            看着像欠账，可那些天你可能刚做完一套难题。答得多不该被罚。
            正确率放在顶行的数字里。

            最左边那一列是「本周还没到的日子」，留空不画。

            ### 里程碑进度条去掉了

            「再练 3 天达成 15 天」那根条子撤了，只留文字。
            热力图已经能看出你这阵子的状态，那根条子反而吵。

            ### 顺带修了个假数字

            今天一题没做的时候，原来显示的是「正确 0%」——0 题哪来的正确率。
            现在 0 题就是显示「还没开始」。

            ### 没动的东西

            过渡带 32dp、Agora 原版九抽头算法、顶栏原样、五个页签都有底缘模糊，
            以及模考即时判定、模考不抽多选题、拍照搜题下线，全都在。

            布局是照我们说好的做的，但真机好不好看你说了算——哪里别扭直接说。

            ---

            **安装**：下载下方 `TiYu-2.19.7.apk` **覆盖安装**即可，学习数据自动迁移。
