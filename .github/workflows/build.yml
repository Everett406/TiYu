name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.15.0
  APP_VERSION_TAG: v2.15.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.15.0

            ### 标题栏渐进式模糊 + 每日提醒后台保活（第四十八轮）

            **① 标题栏渐进式模糊（Progressive Blur）**

            页面标题与正文交界处：内容上滚不再生硬截断，而是随滚动逐渐虚化、溶入标题区
            （模糊半径从 0 渐变到满值，Apple Music / iOS 滚动边缘同款效果）。首页/刷题/
            模考/错题本/设置/搜索/配置 7 个页面全部生效。全新 AGSL 双 pass 实现，
            滚动时零重组开销；Android 12/12L 设备自动回退原行为。

            **② 每日提醒后台保活**

            - 调度引擎从 WorkManager 换为**系统精确闹钟（AlarmManager）**：进程被杀也准时发通知，
              修复「每次打开 APP 才会通知」
            - 开启「每日提醒」时会弹**「后台运行」系统弹窗**（电池优化白名单），建议点允许
            - 重启手机 / 覆盖安装后自动重排；打开 APP 也会自愈式补排
            - 智能时刻不变：按你的刷题习惯选时刻，当天刷过不打扰

            ---

            **安装**：下载下方 `TiYu-2.15.0.apk` 安装覆盖即可，数据自动迁移。
