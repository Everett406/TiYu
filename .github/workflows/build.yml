name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.13.0
  APP_VERSION_TAG: v2.13.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.13.0

            ### 拍照搜题大升级 —— 自建相机页 + 斜拍自动矫正 + 切题/匹配重写（第四十六轮）

            根据真实使用反馈（框大选不中、连体多题、搜不准、担心斜拍）全面升级：

            - **自建相机页**：不再跳系统相机，应用内 CameraX 取景 + 框外压暗引导，
              把整页题放进框内拍，识别率显著更高；快门/闪光/相册一步直达。
            - **斜拍自动矫正**：识别前先测出页面倾斜角（基于文本行基线），自动转正
              再识别——斜着拍也能用，不用刻意举得那么正。
            - **切题重写**（题号不再是唯一判据）：题号错识偏大后全页连体、双栏号序
              跳变、题号被漏识三种场景都能重开新题；页码/页脚行整行丢弃不再污染题干。
            - **匹配重写**：题干整串 + 逐行 + 长串滑窗三级分段匹配（行级天然隔离连体
              污染），Dice 相似度 + 包含率双分数取优，对抗 OCR 截断/漏行，同源文本
              精准对齐——不引入向量模型，不增加体积。
            - 权限变化：需**相机权限**（仅用于取景，可拒绝改用相册选图，功能不丢失）。

            ---

            **安装**：下载下方 `TiYu-2.13.0.apk` 安装覆盖即可，数据自动迁移。
