name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.15
  APP_VERSION_TAG: v2.19.15

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.15

            ### 小浮窗改成真正的浮层了

            你那句话点得很准："完完全全浮在上面，不要占用其他的空间。"

            我之前四版都在**同一个错误的前提**下打转：把小窗当成格子图里的一小块，
            靠偏移摆位置。于是永远在两难里——窗高 50dp、格子才 10dp，
            夹在图里就必然盖住旁边好几列；不想盖就得让它越界，一越界就压住下面的字、
            甚至冲出卡片。**四版就是在"盖住"和"越界"之间来回挪参数。**

            现在换了个做法：把它做成一个**独立窗口**，画在整个界面的最上层。
            不占任何布局、不受父级裁剪、想放哪放哪——这才是"完完全全浮在上面"。

            顺带结清两笔拖了很久的旧账：

            · 之前那个「只有框没有窗」的毛病，是我自己写了个死循环
              （要先量到窗的尺寸才渲染它，不渲染就量不到）。现在由系统直接把量好的
              尺寸交给我，那套自测量代码整个删掉了。
            · **点别处收起**现在自动就有了。以前得自己做事件分发，我一直怕和列表
              滚动打架没敢碰。

            图那块地方原来加的「越界保险丝」也撤了——窗都不在那儿了，用不着。

            ### 其他一切照旧

            热力图本身、卡片高度锁定、渐进模糊（已移除）、顶栏原样、五个页签，
            模考即时判定、拍照搜题下线，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.15.apk` **覆盖安装**即可，学习数据自动迁移。
