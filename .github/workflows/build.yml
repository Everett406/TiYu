name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.11.1
  APP_VERSION_TAG: v2.11.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.11.1

            ### 新功能 —— 系统「其他应用打开」导入题库（第四十轮）

            - **场景**：微信收到题库文件（ZIP 或 CSV）——点开文件 → 右上角「…」→
              「从其他应用打开」→ 选择**题屿**，即可直达导入流程；
              文件管理器、QQ、Telegram 等任何出现「打开方式」的地方同样可用。
              不再需要先保存文件、再进 App 里手动选。
            - **支持格式**：题库 CSV；「CSV + images 图片文件夹」打包的 ZIP（带图题目）。
            - **格式智能识别**：不信任来源应用标记的文件类型（微信常把 zip/csv
              标成「未知文件/纯文本」），改为**内容嗅探**（ZIP 头 PK 判 ZIP、
              其余按 CSV 解析）——csv 被当 zip 发、zip 被当纯文本发，都能正确解析；
              选错文件（如图片、安装包）会给出可读的失败原因，不会崩溃。
            - **直达预览**：打开即弹出导入预览（识别成功 N 题 / 失败行明细 / 图片数），
              确认后自动设为当前题库，可一键「开始刷题」。
            - 大文件保护：超过 128MB 拒绝导入（防误选大文件拖垮内存）。

            ### 撤销 —— 随机选项功能（v2.11.0 回退）

            - v2.11.0 的随机选项整体回退：现有题库的答案解析多按**固定选项字母**
              书写（如「选 C，因为…」），选项打乱后解析与实际选项对不上，功能不达预期。
            - 应用内设置页与刷题/模考中的「随机选项」开关一并移除，其余功能不受影响。
            - **数据完全无损**：数据库版本保持 v5（含一枚不再使用的冗余列），
              从 v2.10.3 或 v2.11.0 升级上来，进度、错题、统计全部原样保留。

            ---

            **安装**：下载下方 `TiYu-2.11.1.apk` 安装覆盖即可，数据自动迁移。
            导入格式与模板见 App 内 设置 → 题库管理 → 导入。
