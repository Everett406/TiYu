name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.2
  APP_VERSION_TAG: v2.19.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.2

            ### 底边的模糊，现在每页都有了

            你说得对，翻其他页面才发现只有主页有。五个底部页签现在**统一**都有：
            首页、练习配置、模考配置、错题本、设置。内容滑到底栏上方时按距离渐次加糊，
            斜坡起点对齐底栏上缘，不再是硬切。

            刷题答题、搜索、交卷这几页本来就没有底栏，不涉及。

            ### 顺带说的两点

            上一版（2.19.1）按你说的把顶栏**整个还原成原样**了——固定标题行，
            不悬浮，也不是胶囊。顶边因此没有内容穿过，也就**没有模糊**了。
            顶栏的任何改动都没留下。

            另外把底栏的尺寸写在了代码里的**一个地方**，
            以后底栏改高度，模糊的起点会自己跟上，不用一页页去改。

            ### 上一版的东西都还在

            模考即时判定开关、模考不抽多选题的修复、拍照搜题下线，都在。

            ---

            **安装**：下载下方 `TiYu-2.19.2.apk` 覆盖安装即可，学习数据自动迁移。
