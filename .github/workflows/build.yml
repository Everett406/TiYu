name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.14
  APP_VERSION_TAG: v2.19.14

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.14

            ### 浮窗冲出卡片了——修了

            你那三张图里最扎眼的就是这个：点最下面几行的格子，小窗会翻到格子下面，
            然后直接冲出卡片，压住下面那行字，还被卡片圆角切掉半截
            （"正确率 77%" 只剩一半、"未练习" 也被裁了）。

            根因是我判断位置时只写了两种可能——"上面放得下就上面，否则放下面"，
            **可"下面"没有任何边界**。现在改成三种：

            · 上面放得下 → 放上面
            · 上面放不下、下面还塞得下 → 才放下面
            · **两边都塞不下 → 贴住图的最下沿**

            任何情况下小窗的上下边都不会跑出热力图那块地。

            另外给那块地加了道"保险丝"：就算哪行代码又算错了，也画不出去了。

            ### 你说的「卡片高度没锁定」，我找到真正的成因了

            不是浮窗闹的，是**文案长短不一样**：
            "再练 4 天达成 7 天"和"手感正热，保持节奏"、
            "今日答对 28 · 答错 12"和"今天还没开始，来几题热热手"——
            大字体或窄屏下其中一些会换行，一换行整张卡就变高。

            现在这些文字全部锁成一行，高度和文案彻底解耦。

            ### 另外自己挑出来的

            选中格子的框又淡了一点（太抢眼）。

            ### 其他一切照旧

            热力图本身、渐进模糊（已移除）、顶栏原样、五个页签，
            模考即时判定、拍照搜题下线，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.14.apk` **覆盖安装**即可，学习数据自动迁移。
