name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.5
  APP_VERSION_TAG: v2.19.5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.5

            ### 过渡带又矮了四分之一

            64 → 43 → 32dp。五个页签一处生效。

            ### 上一版的「优化」撤了

            你说得对，改完更乱。抽头加密、精度提高、缓动改成二次的，
            这些**全部退回**成原来的样子——跟 Agora 原版一字不差。
            带点既然无妨，就留着。

            顺带一句：这轮我把最大模糊半径也从 5dp 放回了 6dp（原来的值）。
            32dp 的带上 6dp 会比 5dp 陡一些，你要是觉得太猛，说一声我压回去。

            ### 算力这边动了手

            先把账算给你看。以 1080×2400 的机器、32dp 的过渡带算：

            | | 每帧取样次数 | 占比 |
            |---|---|---|
            | 过渡带里（真在糊） | 约 190 万 | 28% |
            | 过渡带外（啥也没干） | 约 500 万 | **72%** |

            七成的力气花在了「什么都没做」的地方。这是这套做法的固有代价——
            只想糊那一条带，就得把内容画两遍，而列表是懒加载的，
            两份共用一个滚动状态会互相踩，不安全，所以没那么做。

            砍掉的是三处**纯浪费**，观感一丁点没变：

            1. 模糊效果每帧都在重新创建一遍对象（每帧四个新对象扔掉）。
               现在只建一次。
            2. 多出来的一整块全屏缓冲——模糊本身已经需要离屏渲染了，
               又叠了一层，等于每帧白搬一次全屏画面。已去掉。
            3. 一段在 Android 13 以上什么都不干的绘制代码，也照样挂着。已去掉。

            另外，屏幕旋转或改尺寸时，模糊本来要整个重建一遍；现在只改一个数值。

            ### 另外都没动

            顶栏维持 2.19.1 的原样，五个页签都有底缘模糊，模考即时判定开关、
            模考不抽多选题的修复、拍照搜题下线，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.5.apk` 覆盖安装即可，学习数据自动迁移。
