name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.13
  APP_VERSION_TAG: v2.19.13

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.13

            ### 浮窗改窄了，箭头也会拐弯了

            你那三张截图看得很清楚，我看到三个毛病：

            **一、窗太宽，盖住了半个图。** 我把日期和题量拼成了一行
            （"9月5日 · 答了 206 题"），十几个字排一行，窗宽得能盖住五六列，
            下面的图例、上面的月份标签全被压住了。
            现在拆成**三行**：日期 / 答了 206 题 / 正确率 19%，
            字号也各降一档，窗窄了将近一半。**没练过的日子只出两行**，
            不给不存在的正确率留空位。

            **二、箭头方向不跟着窗走。** 我判断"放上面还是放下面"的时候，
            算了一遍给坐标，却又写死朝下给箭头——于是窗翻到下面去了、
            箭头还指着下面。现在这个判断只算一份，坐标和箭头都用它，
            不会再各说各话。

            **三、选中的黑框太重**，像给格子套了个相框，细了一点、也淡了一点。

            另外顺手改掉一个隐患：估算窗高时我曾把屏幕密度写死成 3，
            换个机型就全错，改成读真实密度了。

            ### 其他一切照旧

            热力图本身、渐进模糊（已移除）、顶栏原样、五个页签，
            模考即时判定、拍照搜题下线，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.13.apk` **覆盖安装**即可，学习数据自动迁移。
