name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  # IS_PREVIEW=true 时走**草稿预览**通道：APK 内部版本号带 -preview 后缀、
  # versionCode 抬高可覆盖安装线上正式版、Release 以 draft 发布（仓库里可见可下载，
  # 但不对外公开）。验证通过后把 IS_PREVIEW 改回 false、版本号去掉后缀即可正式发。
  IS_PREVIEW: 'false'
  APP_VERSION_NAME: 2.19.36
  APP_VERSION_TAG: v2.19.36

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # v2.19.36：生成历程数据需要完整历史（默认 fetch-depth:1 只有最后一个提交，
          # 会让 AppHistory 只剩当前版本一条）。已足够浅，又不拖慢构建。
          fetch-depth: 0

      - name: Regenerate app history
        # v2.19.36：历程表改为每次发版自动重生成，不再靠人记得手跑脚本。
        # 脚本幂等——git 历史没变时输出与仓库内文件一致，重生成不会产生噪声 diff。
        # 真正被更新的 AppHistory.kt 会随 tag 提交记录在案。
        run: python3 scripts/gen_history.py && git --no-pager diff --stat -- app/src/main/java/com/drone/quiz/data/AppHistory.kt || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon ${{ env.IS_PREVIEW == 'true' && '-PtiyuPreview=true' || '' }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          # 预览通道：draft = 仓库内可见可下载，但不会对外公开
          draft: ${{ env.IS_PREVIEW == 'true' }}
          prerelease: ${{ env.IS_PREVIEW == 'true' }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.36

            ### 搜索页瘦身

            · 折叠态的绿色答案**只给字母**了，不再把选项文字抄一遍——
              卡片高度不再被长选项撑起来
            · **选项 A/B/C 不再偏下**：Android 默认的字体留白会把字形压到圆心下方。
              这个问题 v2.19.16 修过一次（刷题页），搜索页那段是同一份代码的另一份拷贝，
              当时漏了，这次一并修
            · 判断题圆标改用**自绘**的 √/×，和刷题页同一套（系统字符 √ 是根号、字重还会飘）

            ### 历程页三处

            · **节点不再是橙色**了，改成低饱和的灰点——整屏点状物压过了内容本身。
              含回滚的版本仍标红，那是有意义的信息
            · **展开有动画了**，和错题本同款（此前是硬切换，秒现秒没）
            · **数据改成发版自动生成**：CI 里跑 `gen_history.py`，
              以后不用再记得手动维护这张表

            ### 错题优先

            上一版的「错题优先」也在。

            ---

            **安装**：下载下方 `TiYu-2.19.36.apk` **覆盖安装**即可，学习数据自动迁移。
