name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.16.0
  APP_VERSION_TAG: v2.16.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.16.0 起含 native 构建（externalNativeBuild/cmake，libdroneocr.so）：
      # 显式装齐 ndkVersion 27.2.12479018 + cmake 3.22.1，不依赖 AGP 在线自动安装
      - name: Install NDK & CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.16.0

            ### 安装包瘦身：OCR 模型按需下载（第四十九轮）

            **安装包从 58MB 减到约 44MB。**

            此前拍照搜题的 OCR 引擎（ML Kit 中文识别）模型内置在安装包里，占了约 14MB。
            本版把模型从包里拆出来：

            - **首次点拍照搜题时**才会提示下载识别模型（约 15MB，仅需一次），
              国内线路（ModelScope 阿里 CDN）直连，下载后离线可用
            - 下载在弹窗内完成（带进度，可取消/失败重试），不需要去设置页找入口
            - 识别引擎同步升级为 PaddleOCR PP-OCRv4，斜拍自动矫正、切题、
              搜题匹配等工作流与上一版完全一致

            **每日提醒后台保活**（上一版功能，本版继续有效）：进程被杀也准时发通知，
            重启手机自动重排。

            **回滚说明**：上一版的标题栏滚动虚化效果实测后撤除，界面回到此前样式。

            ---

            **安装**：下载下方 `TiYu-2.16.0.apk` 安装覆盖即可，数据自动迁移。
            已装 v2.15.0 的用户覆盖安装后，首次用拍照搜题会多一次模型下载。
