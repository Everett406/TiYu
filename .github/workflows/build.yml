name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.19.6
  APP_VERSION_TAG: v2.19.6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.17.0 起工程已无任何 native 代码（拍照搜题/OCR 整体下线，jniLibs 与 cpp/ 一并移除），
      # 构建不再需要 NDK / CMake，这条安装步骤同步删除。

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.19.6

            ### 先说对不起：整屏糊掉是我上一版改坏的

            问题找到了，也修好了。原因是我为了省算力，把"容器高度"改成
            每帧写进已经建好的模糊程序里——**但那个值根本写不进去**。
            程序里高度一直是 0，于是"离底栏越近越糊"那条公式算出来的结果
            对每一行都是 1，整屏就都成了最大模糊。

            说白了就一句：**那个值只能在建好的时候写，不能事后补。**

            还有一条更亏的教训：那一版我一次改了两处（顺带还删了一个多余的图层）。
            结果出了问题也说不清是哪一处惹的，修的时候只能整个退回去，白折腾。
            **以后一次只动一处。**

            ### 保留了的两处改动

            这两个不碰那个值，观感也不会变：

            - 模糊效果原来每帧都重建一遍，现在只建一次（每帧省下四个临时对象）；
            - 一段在 Android 13 以上完全不干活的绘制代码，只在老系统上才挂。

            ### 其他一切照旧

            过渡带 32dp、Agora 原版九抽头算法、顶栏原样、五个页签都有底缘模糊，
            以及更早的模考即时判定、模考不抽多选题、拍照搜题下线，全都在。

            ---

            **安装**：下载下方 `TiYu-2.19.6.apk` **覆盖安装**即可，学习数据自动迁移。
