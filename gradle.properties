kotlin.code.style=official

# v2.19.27：沙箱里 Gradle 的 Java 证书链与出网代理对不上（curl 能通、Gradle 报
# "PKIX path building failed"），导致任何新依赖都拉不下来、**无法本地编译验证**。
# 把沙箱网关 CA 导进一个独立 truststore 后，新依赖可正常解析，依赖升级才能本地验。
# 用法：./gradlew ... -Djavax.net.ssl.trustStore=/workspace/.gradle-home/sandbox-cacerts.jks
#       -Djavax.net.ssl.trustStorePassword=changeit
# （仅沙箱需要；CI / 本地开发机不需要这些参数）
